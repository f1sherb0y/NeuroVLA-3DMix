name: neurovla

channels:
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip=25.1
  # DeepSpeed checks for nvcc at import time. Keep this aligned with PyTorch's CUDA build.
  - cuda-nvcc=12.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - -r requirements.txt
      # Unified train/eval dependencies. LIBERO and robosuite themselves are
      # installed with --no-deps by scripts/setup_neurovla_env.sh so their old
      # requirements cannot downgrade Qwen/NumPy/PyTorch. The same script
      # installs pinned VGGT with --no-deps to preserve opencv-python-headless.
      - bddl==1.0.1
      - cloudpickle==2.1.0
      - easydict==1.9
      - future==0.18.2
      - gym==0.25.2
      - imageio-ffmpeg==0.6.0
      - mediapy==1.2.7
      - mujoco==2.3.7
      - numba==0.60.0
      - opencv-python-headless==4.11.0.86
      - termcolor==2.4.0
      - -e .
