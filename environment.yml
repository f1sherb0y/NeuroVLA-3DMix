name: neurovla

channels:
  - nvidia
  - defaults

dependencies:
  - python=3.10
  - pip=25.1
  # DeepSpeed checks for nvcc at import time. Keep this aligned with PyTorch's CUDA build.
  - cuda-nvcc=12.4
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - -r requirements.txt
      - -e .
